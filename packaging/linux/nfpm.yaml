# Used by scripts/package.sh; VERSION and ARCH come from the environment.
name: sweepkit
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Buğra Şıkel <72806215+bugraskl@users.noreply.github.com>
description: |
  Honest disk cleanup for Windows and Linux.
  Shows what is safe to delete, explains what deleting it costs and deletes
  nothing until you confirm.
vendor: sweepkit
homepage: https://github.com/bugraskl/sweepkit
license: MIT
contents:
  - src: out/linux_${ARCH}/sweepkit
    dst: /usr/bin/sweepkit
    file_info:
      mode: 0755
  - src: out/linux_${ARCH}/sweepkit-gui
    dst: /usr/bin/sweepkit-gui
    file_info:
      mode: 0755
  - src: packaging/linux/sweepkit.desktop
    dst: /usr/share/applications/sweepkit.desktop
  - src: packaging/linux/sweepkit.png
    dst: /usr/share/icons/hicolor/256x256/apps/sweepkit.png
  - src: LICENSE
    dst: /usr/share/licenses/sweepkit/LICENSE
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
